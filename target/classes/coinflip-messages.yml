help-1: "&7Pick heads or tails and a stake. Another player stakes the same amount on the other side."
help-2: "&7The server flips a fair coin: each side has exactly a 50% chance. Your pick, stake, rank and past results never change the odds."
help-3: "&7The winner receives both stakes minus the fee shown before you confirm (currently {fee})."
help-4: "&7Open matches expire after a while and your stake is returned automatically."
help-5: "&7Only in-game currency is used. It cannot be bought with or exchanged for real money."
help-6: "&7Practice mode flips without any currency. You can pause wagering for yourself in Settings."
