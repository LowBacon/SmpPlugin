# CustomSmp CoinFlip Nexus - player-facing messages
#
# Colour codes use & (and &#RRGGBB). Placeholders in {braces} are filled in by the plugin.
# Keep messages neutral: explain results and limits, never urge players to play again or win back losses.
# Missing keys fall back to the built-in English text. Reload with /coinflipadmin reload.

prefix: "&8[&5&lCoinFlip&8] &r"
virtual-notice: "&7All stakes are in-game currency only and have no real-world value."
disabled: "&cCoinFlip is turned off on this server."
maintenance: "&eCoinFlip wagering is paused right now. Practice mode still works."
wagering-blocked: "&eCoinFlip wagering is paused because of a configuration problem. Staff have been told."
no-permission: "&cYou do not have permission to do that."
storage-unavailable: "&cCoinFlip storage is not available, so no currency was moved. Please try again later."
storage-busy: "&eCoinFlip is busy. Nothing was moved; please try again in a moment."
match-changed: "&eThat match changed while you were acting. Nothing was moved; please look again."
held-for-review: "&eMatch &f#{id} &ehit a storage problem. Your currency is safe and staff have been told; it will be settled after review."
loading: "&7Your CoinFlip data is still loading. Try again in a moment."
in-progress: "&7Your last CoinFlip action is still being processed."
cooldown: "&7Please wait {seconds}s before starting another match."
