# ==============================================================================
# Auction House Quick Buy, Your Items and sell statistics
# ==============================================================================

SHOP-GUI:
  SHOW-AUCTION-PRICE: true
  # Configuration section for Item.
  ITEM:
    # Configuration section for Lore.
    LORE:
    - '&7Shop price: {shop_price}'
    - '{auction_line}'
    - ''
    - '{favorite_line}'
    - '&eLeft-click to buy from the shop'
    - '{auction_action}'
    - '{favorite_action}'
  FAVORITES:
    ENABLED: true
  # Sell statistics dashboard at http://<address>:<port>/stats (also /topsell export).
  WEB-SERVER:
    # Set to true to enable the embedded Shop Analytics web server
    ENABLED: false
    # Address to listen on. 127.0.0.1 keeps it on this machine only. The page has no login,
    # so only use 0.0.0.0 behind a firewall or a reverse proxy that adds authentication.
    BIND-ADDRESS: "127.0.0.1"
    # Port for the embedded web server (e.g. 8080 or 25580)
    PORT: 8080
    # Optional public URL shown by /topsell, e.g. "https://stats.example.net/stats".
    # If left empty (""), it automatically resolves to http://localhost:<PORT>/stats
    PUBLIC-URL: ""

# Quick Buy configuration (opened from the Auction House)
QUICK-BUY:
  # Master toggle for Quick Buy system
  ENABLED: true

  # Action bar message displayed above the hotbar when purchasing an item
  # Placeholders: {amount}, {item}, {price}, {price_formatted}
  ACTION-BAR: "&fYou bought {amount} {item} for &a$ &f{price}"

  # Optional override for the purchase sound. Leave blank to use sounds.yml QUICK_BUY.BUY-SUCCESS.
  PURCHASE-SOUND: "minecraft:entity.experience_orb.pickup|1.0|1.0"

  # Dynamic pricing settings for Quick Buy and market price estimation
  PRICING:
    # Whether to follow the lowest active Auction House price when available
    USE-AUCTION-HOUSE: true
    # Multiplier applied when using baseline price from worth.yml (default: 1.0)
    WORTH-MULTIPLIER: 1.0
    # Automatically calculate a fair balanced price for items missing from worth.yml
    AUTO-BALANCE-MISSING: true
    # Multiplier applied to automatically balanced prices (default: 1.0)
    AUTO-BALANCE-MULTIPLIER: 1.0
    # WORTH (default) still prices items that are not listed under FIXED-ITEMS from worth.yml.
    # AUCTION-ONLY leaves those items out of stock until a matching auction listing exists.
    # A material under FIXED-ITEMS sells at that price per item even when the auction house is empty.
    # A cheaper auction listing still wins. A more expensive listing is ignored.
    # Enchantment worth from worth.yml is added on top, so a sharpness sword costs more than the plain sword.
    # Names are Bukkit materials. Quote a namespaced id, for example "minecraft:stick".
    UNLISTED: WORTH
    # FIXED-ITEMS:
    #   STICK: 1.0
    #   DIAMOND: 50.0

  # Main GUI title and inventory size
  TITLE: '&8Quick Buy'
  SIZE: 54

  # Item selection dialog configuration (Choose Item screen)
  CHOOSE-ITEM:
    # Mode for obtaining selectable items:
    # VANILLA: all items/blocks/armor/swords directly from vanilla Minecraft matching the server version (default)
    # CUSTOM: items configured in worth.yml
    MODE: VANILLA
    # Maximum number of items to display in the selection list (default: 2000)
    MAX-ITEMS: 2000
    # Extra materials hidden from Quick Buy's Choose Item screen. Does not affect /orders.
    # Wildcards such as *_SPAWN_EGG are allowed.
    # Command-block variants, infested blocks, and spawn eggs are always hidden even if omitted here.
    BLACKLIST:
      - BEDROCK
      - BARRIER
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - COMMAND_BLOCK_MINECART
      - STRUCTURE_BLOCK
      - STRUCTURE_VOID
      - JIGSAW
      - LIGHT
      - DEBUG_STICK
      - KNOWLEDGE_BOOK
      - TEST_BLOCK
      - TEST_INSTANCE_BLOCK
      - END_PORTAL_FRAME
      - SPAWNER
      - TRIAL_SPAWNER
      - VAULT
      - SPAWNER_EGG
      - REINFORCED_DEEPSLATE
      - BUDDING_AMETHYST
      - FARMLAND
      - DIRT_PATH
      - CHORUS_PLANT
      - PETRIFIED_OAK_SLAB
      - FROGSPAWN
      - SUSPICIOUS_SAND
      - SUSPICIOUS_GRAVEL
      - '*_SPAWN_EGG'
      - 'INFESTED_*'

  # Bedrock freezes on the Choose Item dialog, which is one button per material.
  # Floodgate players get a paged form with search. Submitting search stays on that form.
  # Without Floodgate, search asks in chat. false uses the chest catalogue for pinning.
  BEDROCK:
    ENABLED: true
    PAGE-SIZE: 20

  # Configuration for empty grid slots (slots 0-44)
  EMPTY-SLOT:
    MATERIAL: GRAY_STAINED_GLASS_PANE
    NAME: '&fEmpty'
    LORE:
    - '&o&7Click to choose'
    - '&o&7an item to buy'

  # Item display and pricing lore formats for pinned quick buy items
  ITEM:
    PRICE-FORMAT: '&a$ &f{price}'
    OUT-OF-STOCK: '&cOut of stock'
    EDIT-REMOVE-LORE: '&o&7Click to remove'
    EDIT-RESTORE-LORE: '&o&7Click to add back'

  # Bottom navigation buttons in Quick Buy GUI
  BUTTONS:
    FILTER:
      SLOT: 47
      MATERIAL: HOPPER
      NAME: '&fFilter'
      LORE: '&o&7Click to change'
    REFRESH:
      SLOT: 48
      MATERIAL: ENDER_CHEST
      NAME: '&fQuick Buy'
      LORE:
      - '&o&7Click to refresh prices'
    AUCTION:
      SLOT: 49
      MATERIAL: ANVIL
      NAME: '&fAuction'
      LORE:
      - '&o&7Click to view'
    SEARCH:
      SLOT: 50
      MATERIAL: OAK_SIGN
      NAME: '&fSearch'
      LORE:
      - '&o&7Click to search'
      ACTIVE-QUERY-LORE:
      - '&7Current: &e{query}'
      - '&8Right-click to clear'
    YOUR-ITEMS:
      SLOT: 51
      MATERIAL: CHEST
      NAME: '&fYour Items'
      LORE:
      - '&o&7Click to view'
    EDIT:
      SLOT: 53
      MATERIAL: STICK
      NAME: '&fEdit'
      LORE-NORMAL: '&o&7Click to edit'
      LORE-EDITING: '&o&7Click to save changes'

  # Default pinned items for Quick Buy (leave commented out for an empty grid like default DonutSMP)
  # DEFAULT-ENTRIES:
  #   # Example configuration for default pinned quick buy items:
  #   0:
  #     MATERIAL: TOTEM_OF_UNDYING
  #     AMOUNT: 1
  #   1:
  #     MATERIAL: GOLDEN_APPLE
  #     AMOUNT: 64
  #   2:
  #     MATERIAL: END_CRYSTAL
  #     AMOUNT: 64
