# ==============================================================================
# CustomSmp - Extras (new in 3.0)
# ==============================================================================
#
# Daily rewards, daily challenges, polls, giveaways, chat games, the announcer,
# mail, emotes, the utility commands, /dice and /cf. Each part can be switched off as a
# feature (/smpplugin feature) and every message can be changed in messages.yml
# under V3.
#
# Rewards anywhere in this file take:
#   MONEY: 1000
#   SHARDS: 5
#   ITEMS: ["DIAMOND:3"]
#   COMMANDS: ["crate key give %player% vote 1"]   (run by the console)
#   DISPLAY: ["&aA nice prize"]                    (optional custom text)
# ==============================================================================

# ------------------------------------------------------------------------------
# /daily - one reward a day, a bigger one for every 7 days in a row
# ------------------------------------------------------------------------------
DAILY:
  # Time zone for "a new day", e.g. "Europe/Helsinki". Empty = server time zone.
  TIME-ZONE: ""
  # Days a player may skip before the streak starts over.
  GRACE-DAYS: 1
  # Remind players on join when today's reward is waiting.
  JOIN-REMINDER: true
  # The streak repeats every 7 days. Day 7 is the big one.
  DAYS:
    1:
      MONEY: 500
    2:
      MONEY: 750
      SHARDS: 2
    3:
      MONEY: 1000
      ITEMS: ["GOLDEN_CARROT:16"]
    4:
      MONEY: 1250
      SHARDS: 5
    5:
      MONEY: 1500
      ITEMS: ["EXPERIENCE_BOTTLE:16"]
    6:
      MONEY: 2000
      SHARDS: 8
    7:
      MONEY: 5000
      SHARDS: 20
      ITEMS: ["GOLDEN_APPLE:2"]
  # Extra money added for every full week of streak (week 2 = +1x, week 3 = +2x...).
  WEEKLY-BONUS-MONEY: 500

# ------------------------------------------------------------------------------
# /challenges - three goals a day, the same for everyone
# ------------------------------------------------------------------------------
CHALLENGES:
  PER-DAY: 3
  TIME-ZONE: ""
  # TYPE is one of: BREAK_BLOCKS, PLACE_BLOCKS, KILL_MOBS, KILL_PLAYERS,
  # PLAY_MINUTES, EARN_MONEY (money made by selling).
  POOL:
    miner:
      NAME: "Miner"
      ICON: IRON_PICKAXE
      TYPE: BREAK_BLOCKS
      GOAL: 500
      REWARD:
        MONEY: 1500
    builder:
      NAME: "Builder"
      ICON: BRICKS
      TYPE: PLACE_BLOCKS
      GOAL: 300
      REWARD:
        MONEY: 1200
    hunter:
      NAME: "Monster Hunter"
      ICON: ZOMBIE_HEAD
      TYPE: KILL_MOBS
      GOAL: 40
      REWARD:
        MONEY: 1500
        SHARDS: 3
    warrior:
      NAME: "Warrior"
      ICON: DIAMOND_SWORD
      TYPE: KILL_PLAYERS
      GOAL: 3
      REWARD:
        MONEY: 2500
        SHARDS: 5
    dedicated:
      NAME: "Dedicated"
      ICON: CLOCK
      TYPE: PLAY_MINUTES
      GOAL: 60
      REWARD:
        MONEY: 1000
        SHARDS: 2
    merchant:
      NAME: "Merchant"
      ICON: EMERALD
      TYPE: EARN_MONEY
      GOAL: 10000
      REWARD:
        SHARDS: 5
    digger:
      NAME: "Deep Digger"
      ICON: DIAMOND_SHOVEL
      TYPE: BREAK_BLOCKS
      GOAL: 1500
      REWARD:
        MONEY: 3000
        SHARDS: 4
    slayer:
      NAME: "Slayer"
      ICON: NETHERITE_SWORD
      TYPE: KILL_MOBS
      GOAL: 120
      REWARD:
        MONEY: 3500
        SHARDS: 6
  # Bonus for finishing all of today's challenges.
  ALL-DONE-BONUS:
    MONEY: 2500
    SHARDS: 10

# ------------------------------------------------------------------------------
# Chat games - a question pops up in chat; the first right answer wins
# ------------------------------------------------------------------------------
CHAT-GAMES:
  AUTO: true
  # Minutes between automatic games.
  INTERVAL-MINUTES: 12
  # Fewer players online than this and no automatic game starts.
  MIN-PLAYERS: 3
  # Seconds before the answer is revealed.
  TIME-LIMIT: 60
  TYPES: [UNSCRAMBLE, MATH, TYPE, TRIVIA]
  REWARD:
    MONEY: 750
    SHARDS: 2
  WORDS: [diamond, creeper, netherite, enderman, pumpkin, redstone, villager, obsidian,
          elytra, beacon, trident, axolotl, lantern, skeleton, emerald, phantom, warden,
          blaze, totem, shulker, spawner, amethyst, cobblestone, furnace]
  TRIVIA:
    - QUESTION: "How many blocks of obsidian does a full nether portal frame need?"
      ANSWERS: ["14"]
    - QUESTION: "Which mob drops a totem of undying?"
      ANSWERS: ["evoker", "evokers"]
    - QUESTION: "What is the hardest ore to find in the Nether?"
      ANSWERS: ["ancient debris", "debris"]
    - QUESTION: "How many hearts does the Wither have?"
      ANSWERS: ["150"]
    - QUESTION: "What do you trade with piglins?"
      ANSWERS: ["gold", "gold ingots", "gold ingot"]

# ------------------------------------------------------------------------------
# Announcer - rotating server messages
# ------------------------------------------------------------------------------
ANNOUNCER:
  ENABLED: true
  INTERVAL-SECONDS: 420
  # false = in order, true = random
  RANDOM: false
  SOUND: BLOCK_NOTE_BLOCK_CHIME
  MESSAGES:
    - - "&6&l✦ TIP &8» &7Open one door a day in the &6Spooky Calendar&7: &f/halloween"
    - - "&6&l✦ TIP &8» &7Claim your &adaily reward &7and keep your streak: &f/daily"
    - - "&6&l✦ TIP &8» &7Three new &bchallenges &7every day: &f/challenges"
    - - "&6&l✦ TIP &8» &7Sell items to other players on the Auction House: &f/ah"
    - - "&6&l✦ TIP &8» &7Everything in one place: &f/menu"

# ------------------------------------------------------------------------------
# Polls and giveaways
# ------------------------------------------------------------------------------
POLLS:
  MAX-OPTIONS: 6
  DEFAULT-SECONDS: 60
GIVEAWAYS:
  DEFAULT-SECONDS: 60
  MAX-WINNERS: 10
  # Who may start and cancel giveaways (joining is open to everyone). Server operators and anyone
  # with smpplugin.giveaway.manage always can. Members of these permission groups can too: with
  # LuckPerms every member of a group has the permission group.<name>. Use [] to rely on the
  # permission alone.
  MANAGER-GROUPS:
    - manager
    - developer
    - coowner
    - owner

# ------------------------------------------------------------------------------
# /mail - leave a message for a player who is offline
# ------------------------------------------------------------------------------
MAIL:
  MAX-INBOX: 50
  MAX-LENGTH: 200
  SEND-COOLDOWN-SECONDS: 15

# ------------------------------------------------------------------------------
# Emotes - /slap /highfive /wave /poke /cheer
# ------------------------------------------------------------------------------
EMOTES:
  COOLDOWN-SECONDS: 10
  # Who sees an emote: NEARBY (within RADIUS blocks) or SERVER.
  AUDIENCE: NEARBY
  RADIUS: 48
  LIST:
    slap:
      TARGET: true
      MESSAGE: "&c{player} &7slaps &c{target}&7! &8*smack*"
      PARTICLE: CRIT
      SOUND: ENTITY_PLAYER_ATTACK_STRONG
      PUSH: 0.4
    highfive:
      TARGET: true
      MESSAGE: "&e{player} &7high-fives &e{target}&7! &e✋"
      PARTICLE: FIREWORK
      SOUND: ENTITY_PLAYER_ATTACK_SWEEP
    poke:
      TARGET: true
      MESSAGE: "&b{player} &7pokes &b{target}&7."
      PARTICLE: CLOUD
      SOUND: ENTITY_CHICKEN_EGG
    wave:
      TARGET: false
      MESSAGE: "&a{player} &7waves at everyone &a👋"
      PARTICLE: NOTE
      SOUND: ENTITY_VILLAGER_YES
    cheer:
      TARGET: false
      MESSAGE: "&6{player} &7cheers! &6\\o/"
      PARTICLE: TOTEM_OF_UNDYING
      SOUND: ENTITY_PLAYER_LEVELUP

# ------------------------------------------------------------------------------
# Utility commands
# ------------------------------------------------------------------------------
UTILITIES:
  # /back after a death, as well as after a teleport.
  BACK-AFTER-DEATH: true
  BACK-COOLDOWN-SECONDS: 10
  # /repair: seconds between uses (0 = none).
  REPAIR-COOLDOWN-SECONDS: 3600
  NEAR-RADIUS: 200
  # /firework: seconds between uses.
  FIREWORK-COOLDOWN-SECONDS: 30

# ------------------------------------------------------------------------------
# /dice - bet money on a dice roll against the house (new in 3.1)
# ------------------------------------------------------------------------------
# A payout is the total a win pays back, the bet included: 1.9 on a $100 bet pays $190.
# The server never pays more than the fair amount, so a value above the fair one is
# lowered to it.
#   Bet                     Wins when                     Chance   Fair payout
#   /dice 100               your die beats the house's    41.7%    2.0 (a tie gives the bet back)
#   /dice 100 high | low    4-6 | 1-3                     50%      2.0
#   /dice 100 5             exactly that number           16.7%    6.0
# With the defaults below every bet returns about 95% on average.
DICE:
  MIN-BET: 10
  MAX-BET: 1000000
  PAYOUTS:
    DUEL: 1.9
    HIGH-LOW: 1.9
    NUMBER: 5.7
  # Against the house, does a tie give the bet back? (false = a tie loses)
  TIE-REFUNDS: true
  # Show the bet, chance and payout with a [ROLL] button before any money is taken.
  CONFIRM: true
  CONFIRM-SECONDS: 30
  COOLDOWN-SECONDS: 3
  # Tell the whole server about wins with at least this much profit.
  BROADCAST-WIN-OVER: 50000

# ------------------------------------------------------------------------------
# /cf (/coinflip) - coin flips between players (new in 3.2)
# ------------------------------------------------------------------------------
# A player starts a game with a bet; anyone can join by betting the same, and the flip starts at
# once: both heads spin and the one that stops in the middle wins the pot. Equal bets, so it is an
# exact 50/50, drawn by the server before the spin.
COINFLIP:
  MIN-BET: 1
  # The highest bet. 0 = no maximum.
  MAX-BET: 0
  # Taken from the pot before it is paid out (0 = no fee).
  FEE-PERCENT: 0
  # Open games one player can have at once.
  MAX-OPEN-PER-PLAYER: 3
  # A game nobody joins is cancelled (and the bet given back) after this long.
  EXPIRE-MINUTES: 30
  # The five quick-bet buttons in /cf.
  QUICK-BETS:
    - 1000
    - 10000
    - 100000
    - 1000000
    - 10000000
  # Tell everyone when a game is started, with a [Flip] button.
  ANNOUNCE-NEW: true
  # Tell everyone about flips with a pot at least this big (0 = never).
  BROADCAST-OVER: 100000
