name: SmpPlugin
version: 2.0.0-alpha.5
main: com.bx.smpPlugin.SmpPlugin
authors: [LowBacon]
website: https://github.com/LowBacon/SmpPlugin
# Minimum Minecraft version; filled from minecraft.api.version in pom.xml.
api-version: "26.3"
# No Folia 26.3 build has been tested. See COMPATIBILITY.md.
folia-supported: false
softdepend:
- LPC
- NickPlus
- PlaceholderAPI
- LuckPerms
- Vault
- ProtocolLib
- Apollo
- Multiverse-Core
- floodgate
- FancyNpcs
- voicechat
loadbefore:
- EconomyShopGUI
- EconomyShopGUI-Premium
- UltraCosmetics
- DeluxeMenus
commands:
  lobby:
    description: Go to the lobby, return to Survival, or manage the lobby
    usage: /lobby [survival|border [radius]|reload|debug|help]
  team:
    description: Team management
    usage: /team <create|disband|invite|kick|join|leave|home|sethome|delhome|chat|info|pvp>
  chat:
    permission: smpplugin.staff.chat.use;smpplugin.staff.chat.mute;smpplugin.staff.chat.unmute;smpplugin.staff.chat.delay;smpplugin.staff.chat.clear
    description: Manage global chat settings
    usage: /chat <help|mute|unmute|delay|clear>
  ignore:
    description: Add or remove a player from your ignore list
    usage: /ignore <player|list>
    permission: smpplugin.ignore
  unignore:
    description: Remove a player from your ignore list
    usage: /unignore <player>
    permission: smpplugin.ignore
  msg:
    description: Send a private message
    usage: /msg <player> <message>
    aliases:
    - message
    - tell
    - whisper
    - w
    permission: smpplugin.message
  reply:
    description: Reply to your last private conversation
    usage: /reply <message>
    aliases:
    - r
    permission: smpplugin.message
  pm:
    description: Toggle private messages
    usage: /pm
    aliases:
    - togglepm
    - privatemessages
    permission: smpplugin.message.toggle
  home:
    description: Teleport to your home
    usage: /home [name]
  homes:
    description: List your homes
    usage: /homes
  sethome:
    description: Set your home
    usage: /sethome [name]
  delhome:
    description: Delete a home
    usage: /delhome <name>
  renamehome:
    description: Rename a home
    usage: /renamehome <old> <new>
  spawn:
    description: Teleport to spawn
    usage: /spawn
  setspawn:
    description: Set the primary server spawn at your current location
    usage: /setspawn
    permission: smpplugin.admin.setspawn
  setlobby:
    description: Set the protected lobby location at your current location
    usage: /setlobby
    permission: smpplugin.admin.lobby.setlobby
  afk:
    description: Go to an AFK zone and earn shards while you wait
    usage: /afk [zone]
  away:
    description: Mark yourself AFK, or come back
    usage: /away
    permission: smpplugin.afk.away
  afkzone:
    description: Build and edit AFK zones
    usage: /afkzone <pos1|pos2|create|setregion|setspawn|reward|rename|delete|list|show|reload>
    aliases:
    - afkzones
    permission: smpplugin.admin.afkzone
  rtp:
    description: Random teleport
    usage: /rtp [world]
  rtpq:
    description: Join the RTP queue to be teleported together with other players
    usage: /rtpq [join|leave]
    aliases:
    - rtpqueue
  shop:
    description: Open the shop
    usage: /shop [reload]
  shardshop:
    description: Open the shop that charges shards
    usage: /shardshop
  orders:
    description: Open the Orders board
    usage: /orders [my|collect|reload]
  duel:
    description: Challenge or manage duels
    usage: /duel [player|accept|deny|claims|reload]
  create:
    description: Create a custom duel and invite a player or friend
    usage: /create <invite|friends> <player> [map]
  queue:
    description: Open or join the duel queue
    usage: /queue [join|leave]
  leave:
    description: Leave a duel or FFA queue/match
    usage: /leave
  draw:
    description: Request or accept a duel draw
    usage: /draw
  arena:
    permission: smpplugin.admin.duels
    description: Manage duel arenas
    usage: /arena <create|delete|setpos1|setpos2|setreturn|setdisplay|enable|disable|queue|list|reload>
    aliases:
    - duelarena
  ffa:
    description: Join the instanced FFA queue
    usage: /ffa [join|reload|arena ...]
  ffastats:
    description: View FFA stats
    usage: /ffastats [player]
  ffaarena:
    permission: smpplugin.admin.ffa
    description: Manage FFA arenas
    usage: /ffaarena <create|delete|setpos|setdisplay|settings|enable|disable|list|reload>
  auctionhouse:
    description: Open the Auction House
    usage: /auctionhouse [sell|my|claims|cancel|reload]
    aliases:
    - ah
  enderchest:
    description: Open your custom Ender Chest
    usage: /enderchest [reload]
    aliases:
    - ec
  ecsee:
    description: View another player's Ender Chest
    usage: /ecsee <player>
    permission: smpplugin.admin.ecsee
  sell:
    description: Open sell menu
    usage: /sell
  sellhand:
    description: Sell item in hand
    usage: /sellhand [amount]
  sellall:
    description: Sell all sellable items
    usage: /sellall
  sellhistory:
    description: View sell history
    usage: /sellhistory
  sellmulti:
    description: Open the sell multiplier menu
    usage: /sellmulti [category]
  sellmultiplier:
    description: Open the sell multiplier menu
    usage: /sellmultiplier [category]
  sellprogress:
    description: Open the sell multiplier progress menu
    usage: /sellprogress [category]
  topsell:
    description: View and export sell statistics
    usage: /topsell [gui|items|volume|sellers|export|reset]
    aliases:
    - sellstats
    permission: smpplugin.admin.sellstats
  meta:
    description: Show the item that is currently the farming meta
    usage: /meta
    aliases:
    - farmingmeta
  worth:
    description: Open the worth browser or check held item worth
    usage: /worth [hand|reload]
    aliases:
    - prices
  balance:
    description: Check balance
    usage: /balance [player]
    aliases:
    - bal
    - money
  pay:
    description: Pay a player
    usage: /pay <player> <amount>
  addmoney:
    description: Add money to a player
    usage: /addmoney <player> <amount>
    permission: smpplugin.admin.addmoney
  removemoney:
    description: Remove money from a player
    usage: /removemoney <player> <amount>
    permission: smpplugin.admin.removemoney
  setmoney:
    description: Set a player's money balance
    usage: /setmoney <player> <amount>
    permission: smpplugin.admin.setmoney
  logs:
    description: View a player's activity log
    usage: /logs <player>
    permission: smpplugin.admin.logs
  addplaytime:
    description: Add playtime to a player
    usage: /addplaytime <player> <seconds|1d2h30m>
    permission: smpplugin.admin.addplaytime
  addkills:
    description: Add kills to a player
    usage: /addkills <player> <amount>
    permission: smpplugin.admin.addkills
  adddeaths:
    description: Add deaths to a player
    usage: /adddeaths <player> <amount>
    permission: smpplugin.admin.adddeaths
  setkills:
    description: Set a player's kill count
    usage: /setkills <player> <amount>
    permission: smpplugin.admin.setkills
  setdeaths:
    description: Set a player's death count
    usage: /setdeaths <player> <amount>
    permission: smpplugin.admin.setdeaths
  setplaytime:
    description: Set a player's playtime
    usage: /setplaytime <player> <seconds|1d2h30m>
    permission: smpplugin.admin.setplaytime
  shards:
    description: Check shards
    usage: /shards [player] | /shards everywhere <status|debug> [player]
  shardpay:
    description: Pay shards to a player
    usage: /shardpay <player> <amount>
  addshards:
    description: Add shards to a player
    usage: /addshards <player> <amount>
    permission: smpplugin.admin.shards
  removeshards:
    description: Remove shards from a player
    usage: /removeshards <player> <amount>
    permission: smpplugin.admin.shards
  setshards:
    description: Set a player's shard balance
    usage: /setshards <player> <amount>
    permission: smpplugin.admin.shards
  crate:
    description: Manage crates
    usage: /crate <create|delete|type|open|keys|reload|key|take|set|keyall|add|edit|remove|bind|unbind|listbound|info>
  crates:
    description: Open the crates menu
    usage: /crates
  keys:
    description: Open your crate keys menu
    usage: /keys
  menu:
    description: Open the main menu
    usage: /menu
    aliases:
    - mainmenu
  stats:
    description: View player stats
    usage: /stats [player]
  ping:
    description: Check your ping or another online player's ping
    usage: /ping [player]
  playtime:
    description: Check your playtime or another player's playtime
    usage: /playtime [player]
    aliases:
    - pt
  freeze:
    permission: smpplugin.staff.freeze;smpplugin.admin.freeze
    description: Freeze or unfreeze a player for moderation
    usage: /freeze <player> | /freeze reload
  fly:
    permission: smpplugin.staff.fly;smpplugin.player.fly
    description: Toggle flight mode for yourself or another player
    usage: /fly [player]
  heal:
    description: Restore health for yourself or another player
    usage: /heal [player]
    permission: smpplugin.staff.heal
  feed:
    description: Restore hunger for yourself or another player
    usage: /feed [player]
    permission: smpplugin.staff.feed
  god:
    description: Toggle god mode for yourself or another player
    usage: /god [player]
    permission: smpplugin.staff.god
  kill:
    description: Kill yourself after a confirmation menu (blocked in combat)
    usage: /kill
  gamemode:
    description: Change your gamemode or another online player's gamemode
    usage: /gamemode <mode> [player]
    aliases:
    - gm
    - gmc
    - gms
    - gma
    - gmsp
    permission: smpplugin.staff.gamemode
  staffmode:
    permission: smpplugin.staff.mode;smpplugin.staff.mode.others;smpplugin.admin.staffmode
    description: Toggle the staff moderation hotbar
    usage: /staffmode [player|reload]
    aliases:
    - staff
  stafflist:
    permission: smpplugin.staff.mode.stafflist
    description: Open the online staff list
    usage: /stafflist
  staffchat:
    description: Send a message to staff chat
    usage: /staffchat <message>
    aliases:
    - sc
    permission: smpplugin.staff.chat.use
  helpop:
    description: Request staff assistance
    usage: /helpop <message>
    permission: smpplugin.helpop
  report:
    description: Report a player to online staff
    usage: /report <player> <reason>
    permission: smpplugin.report
  rename:
    description: Rename the item in your hand
    usage: /rename <name...|reset>
    permission: smpplugin.staff.rename
  randomteleport:
    permission: smpplugin.staff.mode.randomtp
    description: Teleport to a random online player
    usage: /randomteleport
    aliases:
    - randomtp
  teleport:
    description: Staff teleport command suite
    usage: /teleport <player|here <player>|all|top|x y z [world]>
    aliases:
    - tp
    - tphere
    - tpall
    permission: smpplugin.staff.teleport
  alts:
    description: View alternate accounts by shared IP history
    usage: /alts <player>
    permission: smpplugin.staff.alts
  vanish:
    permission: smpplugin.staff.mode.vanish
    description: Toggle vanish while in staff mode
    usage: /vanish
  invsee:
    permission: smpplugin.staff.invsee;smpplugin.admin.invsee
    description: View another player's inventory
    usage: /invsee <player> | /invsee reload
    aliases:
    - inventorysee
  profileviewer:
    permission: smpplugin.staff.profileviewer
    description: View a player's profile and homes
    usage: /profileviewer <player>
    aliases:
    - pv
  chatlog:
    description: Browse logged public and team chat
    usage: /chatlog [player]
    permission: smpplugin.admin.chatlog
  seehomes:
    description: View another player's homes
    usage: /seehomes <player>
  punishments:
    permission: smpplugin.staff.punishments.view
    description: View a player's punishment history, or everyone's with no name
    usage: /punishments [player]
    aliases:
    - phistory
  ban:
    description: Ban a player and record punishment history
    usage: /ban <player> [reason]
    permission: smpplugin.staff.punishments.ban
  tempban:
    description: Temporarily ban a player and record punishment history
    usage: '/tempban <player> <time> [reason] (time: 30s, 15m, 2h, 5d, or 5d 15m 30s)'
    permission: smpplugin.staff.punishments.tempban
  mute:
    description: Mute a player and record punishment history
    usage: /mute <player> [reason]
    permission: smpplugin.staff.punishments.mute
  tempmute:
    description: Temporarily mute a player and record punishment history
    usage: '/tempmute <player> <time> [reason] (time: 30s, 15m, 2h, 5d, or 5d 15m 30s)'
    permission: smpplugin.staff.punishments.tempmute
  warn:
    description: Warn a player and record punishment history
    usage: /warn <player> [reason]
    permission: smpplugin.staff.punishments.warn
  kick:
    description: Kick a player and record punishment history
    usage: /kick <player> [reason]
    permission: smpplugin.staff.punishments.kick
  blacklist:
    description: Blacklist a player and record punishment history
    usage: /blacklist <player> [reason]
    permission: smpplugin.staff.punishments.blacklist
  unban:
    description: Remove active ban records for a player
    usage: /unban <player> [reason]
    aliases:
    - pardon
    permission: smpplugin.staff.punishments.unban
  unmute:
    description: Remove active mute records for a player
    usage: /unmute <player> [reason]
    permission: smpplugin.staff.punishments.unmute
  unblacklist:
    description: Remove active blacklist records for a player
    usage: /unblacklist <player> [reason]
    permission: smpplugin.staff.punishments.unblacklist
  vcmute:
    description: Mute a player in Simple Voice Chat, for a time or for good
    usage: /vcmute <player> [time] [reason]
    permission: smpplugin.staff.punishments.vcmute
  vcunmute:
    description: Lift a voice mute
    usage: /vcunmute <player> [reason]
    permission: smpplugin.staff.punishments.vcunmute
  offend:
    description: Punish a player with a preset offense from offenses.yml
    usage: /offend <player> <offense> [time] | /offend <player> | /offend list
    permission: smpplugin.staff.punishments.offend
  bounty:
    description: Manage bounties
    usage: /bounty <add|set|info|list> [player] [amount]
  tpa:
    description: Request teleport to player
    usage: /tpa <player>
  tpahere:
    description: Request player to teleport to you
    usage: /tpahere <player>
  tpaccept:
    description: Accept a TPA request
    usage: /tpaccept [player]
  tpadeny:
    description: Deny a TPA request
    usage: /tpadeny [player]
  tpacancel:
    description: Cancel your TPA requests
    usage: /tpacancel
  tpauto:
    description: Toggle TPA auto-accept
    usage: /tpauto
  tpahereauto:
    description: Toggle TPA Here auto-accept
    usage: /tpahereauto
  leaderboard:
    description: View leaderboards
    usage: /leaderboard [type]
    aliases:
    - lb
    - top
    - leaderboards
  warp:
    description: Teleport to a warp
    usage: /warp [name]
  warpmanager:
    permission: smpplugin.admin.warpmanager;smpplugin.admin.setwarp;smpplugin.admin.delwarp
    description: Manage warp points
    usage: /warpmanager <create|delete|list> [name]
  setwarp:
    permission: smpplugin.admin.warpmanager;smpplugin.admin.setwarp
    description: Set a warp point
    usage: /setwarp <name>
  delwarp:
    permission: smpplugin.admin.warpmanager;smpplugin.admin.delwarp
    description: Delete a warp point
    usage: /delwarp <name>
  portalmanager:
    permission: smpplugin.admin.portalmanager
    description: Manage RTP portal triggers
    usage: /portalmanager <list|info|create|delete|setcuboid|setdestination|setdisplay|toggle|setpriority|sethologramhere>
  nightvision:
    description: Toggle night vision
    usage: /nightvision
    aliases:
    - nv
  phantom:
    description: Toggle phantom spawning
    usage: /phantom
  findplayer:
    description: See which dimension and biome an online player is in
    usage: /findplayer <player>
    aliases:
    - fp
    permission: smpplugin.findplayer
  settings:
    description: Open player settings
    usage: /settings
  discord:
    description: Get Discord link
    usage: /discord
  twitter:
    description: Get Twitter/X link
    usage: /twitter
  store:
    description: Get store link
    usage: /store
  social:
    description: Get social links
    usage: /social
    aliases:
    - media
  rules:
    description: View server rules
    usage: /rules
  safety:
    description: Read the server safety book, or give it to a player
    usage: /safety [reload|add <player>|give <player>]
  help:
    description: View help
    usage: /help
  servers:
    description: View network server status
    usage: /servers
    permission: smpplugin.servers
  friends:
    description: Manage friends and follows
    usage: /friends [list|following|followers|friends|add|remove|search|reload]
  friend:
    description: Manage friends and follows
    usage: /friend [list|following|followers|friends|add|remove|search|reload]
  billford:
    description: Open Billford trade
    usage: /billford
  spawner:
    permission: smpplugin.admin.spawner
    description: Manage Donut-style spawners
    usage: /spawner [give|info|panel|split|reload|remove]
    aliases:
    - spawners
  spawnstash:
    permission: smpplugin.staff.spawnstash;smpplugin.admin.spawnstash
    description: Spawn and manage staff bait stashes
    usage: /spawnstash [spawn|list|remove|reload] [type]
  fakeplayer:
    permission: smpplugin.staff.fakeplayer
    description: Spawn a packet-based fake player (requires ProtocolLib)
    usage: /fakeplayer
  hide:
    permission: smpplugin.hide.scramble;smpplugin.hide.disguise;smpplugin.hide.admin
    description: Scramble your identity or disguise as a configured alias
    usage: /hide <disguise|status|scramble|remove|list>
  disguise:
    permission: smpplugin.hide.disguise;smpplugin.hide.admin
    description: Disguise as a configured alias
    usage: /disguise <alias>
  clearlag:
    description: Manually clear lag entities
    usage: /clearlag
    permission: smpplugin.admin.clearlag
  cuboid:
    description: Manage cuboid regions
    usage: /cuboid <wand|create|delete|list|bind <cuboid> <spawn|shard|rtp-zone> <true|false>|reload>
    permission: smpplugin.admin.cuboid
  amethysttool:
    description: Manage amethyst tools
    usage: /amethysttool give <player> <type> [duration] | /amethysttool reload
    permission: smpplugin.admin.amethysttool
  smpplugin:
    permission: smpplugin.admin.status;smpplugin.admin.reload;smpplugin.admin.statswipe;smpplugin.admin.optimize;smpplugin.admin.setup;smpplugin.admin.features;smpplugin.admin.maintenance
    description: SmpPlugin administration
    usage: /smpplugin <status|reload|statswipe|optimize|setup|features|maintenance>
    aliases:
    - csmp
    - customsmp
  maintenance:
    permission: smpplugin.admin.maintenance
    description: Turn maintenance mode on or off
    usage: /maintenance <on|off|status|setlobby>
  playerwipe:
    description: Wipe everything this plugin stores about one player (backed up first)
    usage: /playerwipe <player> [confirm]
    aliases:
    - pwipe
  playerunwipe:
    description: Restore a wiped player from the backup their wipe left behind
    usage: /playerunwipe <player> [confirm]
    aliases:
    - punwipe
  serverwipe:
    description: Prepare and run a season wipe (backs up worlds first)
    usage: /serverwipe <preview|status|prepare|confirm|cancel>
    permission: smpplugin.admin.serverwipe
  amod:
    description: Manage anvil moderation banned words
    usage: /amod <add|reload> [word]
    permission: smpplugin.admin.anvilmod
  anticheat:
    permission: smpplugin.security.alerts;smpplugin.security.inspect;smpplugin.security.manage
    description: Anti-cheat alerts, evidence, profiles, ban queue, exemptions and status
    usage: /anticheat <alerts|status|checks|history|evidence|profile|bans|exempt|reset|reload>
    aliases:
    - ac
  coinflip:
    description: Open CoinFlip - 1v1 coin flips for in-game currency
    usage: /coinflip [create|browse|join|cancel|challenge|accept|deny|rematch|history|stats|top|practice|settings|help]
    permission: smpplugin.coinflip.use
    aliases:
    - cf
  coinflipadmin:
    description: CoinFlip staff tools - status, inspect, audit, cancel, recover, reconcile, resolve
    usage: /coinflipadmin <status|inspect|audit|cancel|recover|reconcile|resolve|stats|resetstats|disable|enable|reload|refresh|debug>
    permission: smpplugin.coinflip.inspect
    aliases:
    - cfadmin
