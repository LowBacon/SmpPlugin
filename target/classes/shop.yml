  #     AMOUNT: 64
  #   5:
  #     MATERIAL: OBSIDIAN
  #     AMOUNT: 64
  #   6:
  #     MATERIAL: EXPERIENCE_BOTTLE
  #     AMOUNT: 64
  #   7:
  #     MATERIAL: FIREWORK_ROCKET
  #     AMOUNT: 64
  #   8:
  #     MATERIAL: ELYTRA
  #     AMOUNT: 1

