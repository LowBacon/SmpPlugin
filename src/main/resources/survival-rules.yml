# ==============================================================================
# Survival rules: banned items and disabled recipes (new in 4.0)
# ==============================================================================
# Turn the whole module on or off with /smp modules (SURVIVAL_RULES).
# Staff with smpplugin.bypass.itemban are never stopped.
#
# An item is banned by its material, so renaming it or giving it custom data
# does not get round the ban.
#
# BANNED-ITEMS: <MATERIAL>: [what is blocked]
#   PLACE   placing it as a block
#   USE     right-clicking with it
#   CRAFT   crafting it
#   PICKUP  picking it up
# An empty list blocks all four.
#
# DISABLED-RECIPES: recipe keys, e.g. minecraft:end_crystal (the "minecraft:"
# part may be left out). The server's recipes are not changed; the crafting
# result just stays empty, so removing a line brings the recipe straight back.
# ==============================================================================

ENABLED: true

# Only enforce the rules in these worlds. Empty: every world.
WORLDS: []

MESSAGE: '&cThat item is not allowed here: &f{item}&c.'

BANNED-ITEMS:
  # Examples, remove the # to use them:
  # TNT_MINECART: [PLACE, USE, CRAFT]
  # BEDROCK: [PLACE]
  # END_CRYSTAL: [USE]
  DEBUG_STICK: []
  COMMAND_BLOCK_MINECART: []

DISABLED-RECIPES: []
  # - minecraft:tnt_minecart
