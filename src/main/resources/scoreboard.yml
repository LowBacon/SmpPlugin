# ==============================================================================
# The sidebar scoreboard
# ==============================================================================
# Write any text you like in TITLE and LINES: colour codes (&a, &l), hex colours (&#00A4FC)
# and placeholders all work. Add, remove or reorder lines freely (15 at most). An empty
# line ('') is a spacer.
#
# Placeholders that always work, even without PlaceholderAPI:
#   {player} {money} {shards} {kills} {deaths} {playtime}
#   %player_name% %server_online% %server_max_players% %economy_nicestMoney% %economy_shards%
# With PlaceholderAPI installed, every other placeholder works too: all of CustomSmp's own
# (%economy_kills%, %economy_ping%, %economy_team%, %economy_keyall_countdown%...) and other
# plugins' (%luckperms_prefix%...). A placeholder nothing knows is shown as written, so a typo
# is easy to spot.
#
# Special lines: {team}, {shard_booster} and {shard_cuboid} show the matching line
# below, and are left out when they do not apply to the player.
#
# Change the text in game with /sidebar (smpplugin.admin.sidebar):
#   /sidebar lines | add <text> | set <n> <text> | insert <n> <text> | remove <n>
#   /sidebar title <text> | /sidebar reload
# Players hide or show their own sidebar with /sidebar.
# ==============================================================================
SCOREBOARD:
  ENABLED: true
  # Ticks between title frames (the title list below is played as an animation).
  TITLE-UPDATE-TICKS: 2
  # Ticks between refreshing the lines (20 ticks = 1 second). Only lines whose text changed
  # are sent to the player, so a lower value costs very little.
  LINE-UPDATE-TICKS: 10
  # The text or value for Team. Available options: Any valid string text
  TEAM: '&#00A4FC🪓 &fTeam &#00A4FC%economy_team%     '
  # The text or value for Shard Booster. Available options: Any valid string text
  SHARD-BOOSTER: '&#A303F9⚡ &fBooster &#A303F9%economy_booster_countdown%     '
  # The text or value for Shard Cuboid. Available options: Any valid string text
  SHARD-CUBOID: '&#A303F9⌛ &fShards &#A303F9%economy_shard_cuboid_display%     '
  TITLE:
  - '&#0069d6&lC&#0374da&lu&#067fdf&ls&#0a8be3&lt&#0d96e7&lo&#10a1ec&lm&#13acf0&lS&#17b8f4&lM&#1ac3f9&lP'
  # Configuration section for Lines.
  LINES:
  - ''
  - '&#00FC00&l$ &fMoney &#00FC00%economy_nicestMoney%     '
  - '&#A303F9★ &fShards &#A303F9%economy_shards%     '
  - '&#FC0000🗡 &fKills &#FC0000%economy_kills%      '
  - '&#F97603☠ &fDeaths &#F97603%economy_deaths%   '
  - '&#00A4FC⌛ &fKeyall &#00A4FC%economy_keyall_countdown%'
  - '&#FCE300⌚ &fPlaytime &#FCE300%economy_playtime%   '
  - '{team}'
  - '{shard_cuboid}'
  - '{shard_booster}'
  - ''
  - '&7NA East &7(&#0069D6%economy_ping%ms&7)'
