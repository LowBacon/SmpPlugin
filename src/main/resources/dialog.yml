# ==============================================================================
# SmpPlugin - Dialog Configuration
# ==============================================================================
#
# Dialogs are the pop-up screens added in Minecraft 1.21.6. They need Paper or
# Purpur. On Spigot, or when a screen is turned off below, the command opens the
# chest menu from menus.yml instead, so this file is safe on every server.
#
# Screens in this version: /settings, /homes, /stats, /tpa, the TPA request pop-up (off by default),
# the Auction House purchase and sell screens, the /rtpq confirmation and the
# Quick Buy item picker in the Auction House.
#
# Keys missing from your copy of this file are read from the plugin's built-in
# copy, so screens added in an update work without editing anything.
#
# BUTTONS take one of:
#   ACTION:  "smpplugin:<id>"   a screen or toggle handled by the plugin
#   COMMAND: "ah"               closes the dialog, then runs the command
# ACTION wins when both are present. Only a-z, 0-9, '.', '_' and '-' are legal
# in an action id.
#
# Labels can use %economy_setting_<id>%. The plugin fills these in itself, so
# they work without PlaceholderAPI.
#
# WIDTH values are in GUI pixels and are clamped to 1..1024 by the client.
# COLUMNS controls how many buttons sit side by side.
# ==============================================================================

# Master switch. false keeps every command on the chest menus even on Paper.
ENABLED: true

# Per-screen switches. false sends that command back to its chest menu.
SCREENS:
  SETTINGS: true
  RTP-QUEUE: true
  # /homes as a grid of slots with a manage screen per home. false uses the chest menu.
  HOMES: true
  # /stats as a player list with heads, then a stat sheet. false uses the chest menu.
  STATS: true
  # /tpa and /tpahere without a name: online players with heads, a name box and your
  # waiting requests. Also the Accept / Deny pop-up when a request arrives.
  TPA: true
  # The pop-up a player gets for an incoming /tpa or /tpahere. Off: the DonutSMP-style confirm
  # menu opens instead (TPA-CONFIRM-MENU in menus.yml), as on UltimateDonutSMP.
  TPA-REQUEST: false
  # Auction House: buying shows the item, seller, price and time left; /ah sell without
  # a price asks for one next to the item in your hand.
  AUCTION-HOUSE: true

SETTINGS_DIALOG:
  TITLE: "Settings"
  TEXT: "Choose a category to change your settings"
  EXTERNAL-TITLE: "Settings"
  AFTER-ACTION: NONE
  ITEM: ""
  COLUMNS: 1
  BUTTON-WIDTH: 250
  CATEGORIES-COLUMNS: 2
  CATEGORIES-BUTTON-WIDTH: 150
  CATEGORY-TITLE: "Settings - %category%"
  # No main dialog menu in this version, so the category list has no Back button.
  BACK-LABEL: ""
  CATEGORY-BACK-LABEL: "Back"
  CATEGORY-BACK-ACTION: "smpplugin:settings"
  CATEGORIES:
    - ID: "chat"
      NAME: "Chat"
      LABEL: "<item:oak_sign> Chat"
      BUTTONS:
        - LABEL: "Public Chat: %economy_setting_publicchat%"
          ACTION: "smpplugin:toggle_publicchat"
        - LABEL: "Private Messages: %economy_setting_privatemessages%"
          ACTION: "smpplugin:toggle_privatemessages"
        - LABEL: "Server Chat Messages: %economy_setting_servermessages%"
          ACTION: "smpplugin:toggle_servermessages"
        - LABEL: "Server Hotbar Messages: %economy_setting_hotbarmessages%"
          ACTION: "smpplugin:toggle_hotbarmessages"
        - LABEL: "Death Messages: %economy_setting_deathmessages%"
          ACTION: "smpplugin:toggle_deathmessages"
        - LABEL: "Advancement Messages: %economy_setting_advancementmessages%"
          ACTION: "smpplugin:toggle_advancementmessages"
        - LABEL: "Join/Leave Messages: %economy_setting_joinleavemessages%"
          ACTION: "smpplugin:toggle_joinleavemessages"
        - LABEL: "Team Chat Sending Mode: %economy_setting_teamchat%"
          ACTION: "smpplugin:toggle_teamchat"
    - ID: "notifications"
      NAME: "Notifications"
      LABEL: "<item:bell> Notifications"
      BUTTONS:
        - LABEL: "Pay Alerts: %economy_setting_payalerts%"
          ACTION: "smpplugin:toggle_payalerts"
        - LABEL: "Teleport Alerts: %economy_setting_tpaalerts%"
          ACTION: "smpplugin:toggle_tpaalerts"
        - LABEL: "Bounty Alerts: %economy_setting_bountyalerts%"
          ACTION: "smpplugin:toggle_bountyalerts"
        - LABEL: "Auction Alerts: %economy_setting_auctionalerts%"
          ACTION: "smpplugin:toggle_auctionalerts"
        - LABEL: "Order Alerts: %economy_setting_orderalerts%"
          ACTION: "smpplugin:toggle_orderalerts"
        - LABEL: "Server Sounds: %economy_setting_serversounds%"
          ACTION: "smpplugin:toggle_serversounds"
        - LABEL: "Follow Alerts: %economy_setting_followalerts%"
          ACTION: "smpplugin:toggle_followalerts"
    - ID: "pvp"
      NAME: "PvP"
      LABEL: "<item:diamond_sword> PvP"
      BUTTONS:
        - LABEL: "Fast Crystals: %economy_setting_fastcrystals%"
          ACTION: "smpplugin:toggle_fastcrystals"
        - LABEL: "Totem Particles: %economy_setting_totemparticles%"
          ACTION: "smpplugin:toggle_totemparticles"
        - LABEL: "Explosion Particles: %economy_setting_explosionparticles%"
          ACTION: "smpplugin:toggle_explosionparticles"
        - LABEL: "Explosion Sounds: %economy_setting_explosionsounds%"
          ACTION: "smpplugin:toggle_explosionsounds"
        - LABEL: "Combat Timer: %economy_setting_combattimer%"
          ACTION: "smpplugin:toggle_combattimer"
        - LABEL: "Automatic Respawn Kit: %economy_setting_chainmailonrespawn%"
          ACTION: "smpplugin:toggle_chainmailonrespawn"
        - LABEL: "Lunar Teammates: %economy_setting_lunarteammates%"
          ACTION: "smpplugin:toggle_lunarteammates"
    - ID: "visuals"
      NAME: "Visuals"
      LABEL: "<item:spyglass> Visuals"
      BUTTONS:
        - LABEL: "Display CustomSmp+: %economy_setting_displaydonutplus%"
          ACTION: "smpplugin:toggle_displaydonutplus"
        - LABEL: "Item Worth Lore: %economy_setting_worthdisplay%"
          ACTION: "smpplugin:toggle_worthdisplay"
        - LABEL: "Teleport Confirm Menus: %economy_setting_tpaconfirm%"
          ACTION: "smpplugin:toggle_tpaconfirm"
        - LABEL: "Scoreboard: %economy_setting_scoreboard%"
          ACTION: "smpplugin:toggle_scoreboard"
    - ID: "privacy"
      NAME: "Privacy"
      LABEL: "<item:barrier> Privacy"
      BUTTONS:
        - LABEL: "Teleport Requests: %economy_setting_tparequests%"
          ACTION: "smpplugin:toggle_tparequests"
        - LABEL: "Teleport-Here Requests: %economy_setting_tpahere%"
          ACTION: "smpplugin:toggle_tpahere"
        - LABEL: "Allow Payments: %economy_setting_payments%"
          ACTION: "smpplugin:toggle_payments"
        - LABEL: "Randomized Coords: %economy_setting_randomizedcoords%"
          ACTION: "smpplugin:toggle_randomizedcoords"
        - LABEL: "Private Transactions: %economy_setting_privatetransactions%"
          ACTION: "smpplugin:toggle_privatetransactions"
    - ID: "general"
      NAME: "General"
      LABEL: "<item:paper> General"
      BUTTONS:
        - LABEL: "Auction Quick Buy: %economy_setting_auctionquickbuy%"
          ACTION: "smpplugin:toggle_auctionquickbuy"
        - LABEL: "Auction Quick Sell: %economy_setting_auctionquicksell%"
          ACTION: "smpplugin:toggle_auctionquicksell"
        - LABEL: "Include Shulkers When Selling: %economy_setting_sellshulkers%"
          ACTION: "smpplugin:toggle_sellshulkers"
        - LABEL: "Mob Spawns: %economy_setting_mobspawns%"
          ACTION: "smpplugin:toggle_mobspawns"
        - LABEL: "Phantom Spawning: %economy_setting_phantomspawning%"
          ACTION: "smpplugin:toggle_phantomspawning"
        - LABEL: "Night Vision: %economy_setting_nightvision%"
          ACTION: "smpplugin:toggle_nightvision"
        - LABEL: "Destroy Pearl on Death: %economy_setting_destroypearlondeath%"
          ACTION: "smpplugin:toggle_destroypearlondeath"

RTP_QUEUE_DIALOG:
  TITLE: "RTP Queue"
  EXTERNAL-TITLE: "RTP Queue"
  CAN-CLOSE-WITH-ESCAPE: true
  AFTER-ACTION: NONE
  PAUSE: false
  ITEM: ""
  COLUMNS: 2
  BUTTON-WIDTH: 100
  TEXT-WIDTH: 200
  QUESTION: "Are you sure you want to randomly teleport with another player?"
  NO-LABEL: "&cNo"
  NO-ACTION: "smpplugin:rtp_queue_deny"
  YES-LABEL: "&#00FC00Yes"
  YES-ACTION: "smpplugin:rtp_queue_accept"

# /homes: filled homes first, then the empty slots the player has, then locked ones.
HOMES_DIALOG:
  TITLE: "Homes"
  EXTERNAL-TITLE: "Homes"
  ITEM: "WHITE_BED"
  COLUMNS: 4
  EXPANDED-COLUMNS: 6
  BUTTON-WIDTH: 65
  # %icon% is the home's icon drawn in the button. A material the server no longer knows leaves it
  # blank, and the entry falls back to ENTRY-FORMAT-NO-ICON.
  ENTRY-FORMAT: "%icon% %name%"
  ENTRY-FORMAT-NO-ICON: "%name%"
  HOME-TOOLTIP: "%name%\nClick to manage"
  NEW-HOME-LABEL: "&aNew Home"
  NEW-HOME-TOOLTIP: "Click to set a home where you stand"
  TEAM-HOME-LABEL: "&bTeam Home"
  LOCKED-LABEL: "&cLocked"
  # Shown on locked slots. LOCKED-TOOLTIP-1, -2, ... override it for the slots of each tier below,
  # so you can name the rank that unlocks them, e.g. LOCKED-TOOLTIP-2: "&7Unlocked by &bVIP".
  LOCKED-TOOLTIP: "&7Get a higher rank for more home slots"
  SHOW-MORE-LABEL: "Show More"
  TOTAL-SLOTS: 90
  # How many slots each "Show More" press reveals in total.
  TIERS:
    - 3
    - 9
    - 27
    - 90

CREATE_HOME_DIALOG:
  TITLE: "Create Home"
  EXTERNAL-TITLE: "Create Home"
  ITEM: "WHITE_BED"
  INPUTS:
    - ID: "home_name"
      LABEL: "Home Name"
      WIDTH: 200
      MAX-LENGTH: 16
  BUTTONS:
    - LABEL: "&#00FC00Save Home"
      ACTION: "smpplugin:execute_create_home"
    - LABEL: "Cancel"
      ACTION: "smpplugin:homes_menu"

HOME_MANAGE_DIALOG:
  TITLE: "%name%"
  EXTERNAL-TITLE: "%name%"
  COLUMNS: 2
  BUTTON-WIDTH: 150
  BUTTONS:
    - LABEL: "&aTeleport"
      ACTION: "smpplugin:teleport_home_%slot%"
    - LABEL: "Change Icon"
      ACTION: "smpplugin:change_icon_prompt_%slot%"
    - LABEL: "Rename"
      ACTION: "smpplugin:rename_home_prompt_%slot%"
    - LABEL: "&cDelete"
      ACTION: "smpplugin:delete_home_prompt_%slot%"
    - LABEL: "Back"
      ACTION: "smpplugin:homes_menu"

CHANGE_HOME_ICON_DIALOG:
  TITLE: "Choose Icon"
  EXTERNAL-TITLE: "Choose Icon"
  INPUT-LABEL: "Search"
  SEARCH-LABEL: "Search"
  DEFAULT-LABEL: "Default"
  BACK-LABEL: "Back"
  # BUTTON-WIDTH sizes the three controls; results are wider so long item names fit.
  BUTTON-WIDTH: 96
  RESULT-WIDTH: 128
  COLUMNS: 4
  # Results shown per search. Lower it if the full item list is slow to open on your server.
  MAX-RESULTS: 2000

RENAME_HOME_DIALOG:
  TITLE: "Rename"
  EXTERNAL-TITLE: "Rename"
  ITEM: ""
  INPUTS:
    - ID: "new_name"
      LABEL: "New Name"
      WIDTH: 200
      MAX-LENGTH: 16
  BUTTONS:
    - LABEL: "Save"
      ACTION: "smpplugin:execute_rename_home_%slot%"
    - LABEL: "Cancel"
      ACTION: "smpplugin:manage_home_%slot%"

DELETE_HOME_CONFIRM_DIALOG:
  TITLE: "&cDelete %name%?"
  EXTERNAL-TITLE: "&cDelete %name%?"
  ITEM: ""
  COLUMNS: 2
  BUTTON-WIDTH: 100
  BUTTONS:
    - LABEL: "Cancel"
      ACTION: "smpplugin:manage_home_%slot%"
    - LABEL: "&cDelete"
      ACTION: "smpplugin:execute_delete_home_%slot%"

# /stats: your own stats in a few lines, with a search button and the leaderboards.
STATS_SEARCH_DIALOG:
  TITLE: "Search Player"
  EXTERNAL-TITLE: "Search Player"
  DESCRIPTION: "Type a player's name to see their stats"
  COLUMNS: 2
  BUTTON-WIDTH: 120
  INPUTS:
    - ID: "player_name"
      LABEL: "Player Name"
      WIDTH: 240
      MAX-LENGTH: 16
  BUTTONS:
    - LABEL: "&#00FC00Search"
      ACTION: "smpplugin:execute_add_stats_player"
    - LABEL: "Back"
      ACTION: "smpplugin:stats_menu"

# Tokens: %player% %status% %team% %money% %shards% %kills% %deaths% %kd% %playtime%
# %blocks_broken% %blocks_placed% %mobs_killed% %kill_streak% %highest_kill_streak%
PLAYER_STATS_DIALOG:
  TITLE: "%player%"
  EXTERNAL-TITLE: "%player%"
  # The line next to the player's head at the top.
  HEADER: "&f&l%player% &r%status%"
  AFTER-ACTION: CLOSE
  COLUMNS: 2
  BUTTON-WIDTH: 120
  TEXT-WIDTH: 220
  ONLINE-STATUS: "&a● Online"
  OFFLINE-STATUS: "&7● Offline"
  NO-TEAM: "&7none"
  STATS-FORMAT:
    - "&7Money &a$%money%"
    - "&7Kills &f%kills%  &8|  &7Deaths &f%deaths%"
    - "&7Playtime &f%playtime%"
  BUTTONS:
    - LABEL: "&eSearch Player"
      ACTION: "smpplugin:stats_add_prompt"
    - LABEL: "&6Leaderboards"
      COMMAND: "leaderboard"
  CLOSE-LABEL: "Close"
