# Public rank guide shown by /rank and /ranks. Edit this file to change names,
# listed permissions, benefits and perks. It is a guide: permissions are still
# granted by LuckPerms. Keep the group ID (section key) matched to LuckPerms.
RANKS:
  default:
    DISPLAY: "&f&lBASIC"
    PREFIX: "&7"
    PERMISSIONS: ["smpplugin.perks", "smpplugin.homes"]
    BENEFITS: ["5 personal homes", "1 team home through your team"]
    PERKS: ["Access to the Custom SMP features"]
  vip:
    DISPLAY: "&a&lVIP"
    PREFIX: "&a&lVIP &r"
    PERMISSIONS: ["smpplugin.rank.vip"]
    BENEFITS: ["5 to 10 personal homes", "VIP rank prefix"]
    PERKS: ["10% calendar and daily reward bonus", "Faster event waits and extra Halloween knocks"]
  vipplus:
    DISPLAY: "&6&lVIP+"
    PREFIX: "&6&lVIP+ &r"
    PERMISSIONS: ["smpplugin.rank.vipplus"]
    BENEFITS: ["10 to 20 personal homes", "VIP+ rank prefix"]
    PERKS: ["20% calendar and daily reward bonus", "More event wait reductions and extra Halloween knocks"]
  media:
    DISPLAY: "&d&lMEDIA"
    PREFIX: "&d&lMEDIA &r"
    PERMISSIONS: ["rank.media", "group.media"]
    BENEFITS: ["Up to 99 personal homes", "Media rank prefix"]
    PERKS: ["Creator rank perks configured by the server"]
  helperjr:
    DISPLAY: "&b&lHELPER JR"
    PREFIX: "&b&lHELPER JR &r"
    PERMISSIONS: ["smpplugin.role.helperjr"]
    BENEFITS: ["10 to 20 personal homes", "Junior helper staff tools"]
    PERKS: ["Staff role; permissions depend on the server's LuckPerms setup"]
