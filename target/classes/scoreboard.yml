# ==============================================================================
# The sidebar scoreboard
# ==============================================================================
# Write any text you like in TITLE and LINES: colour codes (&a, &l), hex colours (&#00A4FC)
# and placeholders all work. Add, remove or reorder lines freely (15 at most). An empty
# line ('') is a spacer.
#
# The server's name comes from BRANDING in config.yml (CustomSMP by default):
#   {server_title}  the name in a bold gradient (the default title)
#   {server_name}   the name as plain text
#
# Placeholders that always work, even without PlaceholderAPI:
#   %smp_player_name% %smp_rank% %smp_balance% %smp_shards% %smp_kills% %smp_deaths%
#   %smp_kdr% %smp_playtime% %smp_team% %smp_online% %smp_max_players% %smp_elo%
#   every %economy_...% placeholder, {player} {money} {shards} {kills} {deaths} {playtime}
# With PlaceholderAPI installed, other plugins' placeholders work too (%luckperms_prefix%...).
# A placeholder nothing can fill is left out (HIDE-UNRESOLVED-PLACEHOLDERS below).
#
# Special lines: {team}, {shard_booster} and {shard_cuboid} show the matching line
# below, and are left out when they do not apply to the player.
#
# Change the text in game with /sidebar (smpplugin.admin.sidebar):
#   /sidebar lines | add <text> | set <n> <text> | insert <n> <text> | remove <n>
#   /sidebar title <text> | /sidebar reload
# Players hide or show their own sidebar with /sidebar.
# ==============================================================================
SCOREBOARD:
  ENABLED: true
  # Ticks between title frames (the title list below is played as an animation).
  TITLE-UPDATE-TICKS: 2
  # Ticks between refreshing the lines (20 ticks = 1 second). Only lines whose text changed
  # are sent to the player, so a lower value costs very little.
  LINE-UPDATE-TICKS: 10
  # The {team} line.
  TEAM: '&#00A4FC🪓 &fTeam &#00A4FC%smp_team%'
  # The {shard_booster} line, shown while a shard booster runs.
  SHARD-BOOSTER: '&#A303F9⚡ &fBooster &#A303F9%economy_booster_countdown%     '
  # The {shard_cuboid} line, shown inside a shard area.
  SHARD-CUBOID: '&#A303F9⌛ &fShards &#A303F9%economy_shard_cuboid_display%     '
  TITLE:
  - '{server_title}'
  # The lines, top to bottom. Remove a line to hide it, move it to reorder.
  LINES:
  - ''
  - '&#00A4FC👤 &fPlayer &#00A4FC%smp_player_name%'
  - '&#FCE300♛ &fRank %smp_rank%'
  - '&#00FC00&l$ &fBalance &#00FC00$%smp_balance%'
  - '&#A303F9★ &fShards &#A303F9%smp_shards%'
  - '&#FC0000🗡 &fKills &#FC0000%smp_kills%'
  - '&#F97603☠ &fDeaths &#F97603%smp_deaths%'
  - '&#FC5C7D⚔ &fK/D &#FC5C7D%smp_kdr%'
  - '&#FCE300⌚ &fPlaytime &#FCE300%smp_playtime%'
  - '{team}'
  - '&#00A4FC● &fOnline &#00A4FC%smp_online%&7/&#00A4FC%smp_max_players%'
  - '{shard_cuboid}'
  - '{shard_booster}'
  - ''
  - '&7Server &#00A4FC{server_name}'
  # A placeholder nothing can fill (a typo, a plugin that is not installed) is left out
  # instead of being shown as code. false shows it as written, handy while editing.
  HIDE-UNRESOLVED-PLACEHOLDERS: true
  # When one of these plugins is installed, SmpPlugin leaves the sidebar to it.
  # Set OVERRIDE-OTHER-PLUGINS: true to show SmpPlugin's sidebar anyway.
  YIELD-TO:
  - TAB
  - FeatherBoard
  - AnimatedScoreboard
  - SimpleScore
  - KiteBoard
  OVERRIDE-OTHER-PLUGINS: false
