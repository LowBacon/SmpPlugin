# FinnishSMP CoinFlip Nexus
#
# A 1v1 coin flip for the server's in-game currency. Two players stake the same amount, the server flips a
# fair coin (50/50, never influenced by stakes, ranks or history) and the winner receives both stakes minus
# the fee below. Only in-game currency is used; nothing here can be bought with real money.
#
# Every setting is validated at startup and on /coinflipadmin reload. Problems are listed with the key, what
# was expected, what was found and what was done. An invalid money setting (stake limits, fee) pauses
# wagering until it is fixed; practice mode keeps working. Settings marked (restart) need a server restart.
# Messages are in coinflip-messages.yml. Full reference: docs/coinflip.md

ENABLED: true
# Pause wagering for everyone (practice still works). Staff can also use /coinflipadmin disable|enable.
MAINTENANCE: false
# Log extra detail about every money movement (no balances or secrets are logged).
DEBUG: false

ECONOMY:
  # Smallest and largest stake per player, in coins.
  MIN-STAKE: 100
  MAX-STAKE: 1000000
  # Allow stakes with cents (e.g. 10.50). The economy keeps two decimal places.
  ALLOW-DECIMALS: false
  # Fee taken from the pot, in percent (0 to 50, at most two decimals). Shown to players before they confirm.
  # The fee is removed from circulation. Default: no fee.
  FEE-PERCENT: 0
  # Offer an "all in" button that sets the stake to the player's whole balance (still within MAX-STAKE).
  ALLOW-FULL-BALANCE: false
  # Stakes at or above this ask for one extra confirmation click. 0 = never.
  HIGH-STAKE-CONFIRM: 100000
  # Amount buttons in the create menu (up to 8).
  INCREMENTS: [1, 10, 100, 1000, 5000, 10000, 50000, 100000]

MATCHES:
  # A public match that nobody joins is cancelled and refunded after this long.
  EXPIRY-SECONDS: 300
  # A private challenge that is not accepted is cancelled and refunded after this long.
  CHALLENGE-EXPIRY-SECONDS: 120
  # Open matches one player may have at once.
  MAX-ACTIVE-PER-PLAYER: 1
  # Open matches on the whole server.
  MAX-ACTIVE-TOTAL: 200
  # Most matches shown in the public browser.
  MAX-PUBLIC-LISTED: 200
  ALLOW-PRIVATE: true
  ALLOW-REMATCH: true

LIMITS:
  # Seconds between creating or joining matches.
  COOLDOWN-SECONDS: 3
  # Per player per day (server time). 0 = no limit.
  DAILY-WAGER-CAP: 0
  DAILY-NET-LOSS-CAP: 0
  DAILY-MATCH-CAP: 0
  # Minutes of playtime before a player may wager. 0 = none.
  MIN-PLAYTIME-MINUTES: 0
  # Remind a player after this many minutes of continuous play. 0 = off.
  SESSION-REMINDER-MINUTES: 0
  # Self-exclusion lengths offered in Settings, in hours (up to 4). Cannot be shortened once chosen.
  SELF-EXCLUSION-HOURS: [1, 24, 168]

SECURITY:
  # Minimum milliseconds between menu clicks that do something.
  CLICK-COOLDOWN-MS: 150
  # Minimum milliseconds between /coinflip commands.
  COMMAND-COOLDOWN-MS: 500
  BROWSER-REFRESH-COOLDOWN-MS: 1000
  # Storage work allowed to wait in the queue before new requests are refused (restart).
  MAX-PENDING-STORAGE-OPERATIONS: 500

ANIMATION:
  # FAST, SUBTLE, CLASSIC, CINEMATIC, REDUCED (less motion) or OFF. Players can choose their own in Settings.
  DEFAULT-PRESET: CLASSIC
  PARTICLES: true
  SOUNDS: true
  # Reveal animations running at once; extra viewers see the result without animation.
  MAX-CONCURRENT: 100
  # "namespace:sound.key|volume|pitch"
  SOUND-EFFECTS:
    CLICK: "minecraft:ui.button.click|0.6|1.2"
    TICK: "minecraft:block.note_block.hat|0.6|1.6"
    REVEAL: "minecraft:block.note_block.bell|0.8|1.0"
    WIN: "minecraft:entity.player.levelup|0.8|1.2"
    RESULT: "minecraft:block.note_block.chime|0.7|0.9"
    ERROR: "minecraft:block.note_block.bass|0.7|0.6"
    INVITE: "minecraft:block.note_block.pling|0.8|1.4"

BROADCAST:
  # Announce big wins in chat. Players can opt out of having their own wins announced.
  ENABLED: true
  MIN-POT: 100000
  COOLDOWN-SECONDS: 30

LEADERBOARDS:
  REFRESH-MINUTES: 5
  SIZE: 45
  # Win-rate ranking only includes players with at least this many finished matches.
  MIN-MATCHES-FOR-WIN-RATE: 20

ACHIEVEMENTS:
  ENABLED: true
  NOTIFY: true
  # Console commands run once when an achievement unlocks. Off by default; keep rewards cosmetic so they
  # cannot be farmed for currency. {player} is replaced with the player name.
  REWARDS-ENABLED: false
  REWARDS:
    FIRST_WIN: []
    PLAYED_100: []

STORAGE:
  # Delete finished matches (and their settled transactions) older than this many days. 0 = keep forever.
  # Matches with a pending claim or an unresolved transaction are never deleted.
  HISTORY-RETENTION-DAYS: 0
  QUERY-TIMEOUT-SECONDS: 10

WEBHOOK:
  # Post finished matches with a big pot to a Discord channel. Off by default.
  ENABLED: false
  URL: ""
  MIN-POT: 100000
  TIMEOUT-SECONDS: 5
  MIN-INTERVAL-SECONDS: 10

GUI:
  TITLE-PREFIX: "&5&lCoinFlip"
  # Fewer symbols and decoration, for players who prefer plain menus. Players can switch it in Settings.
  READABLE-DEFAULT: false
  MATERIALS:
    HEADS: GOLD_BLOCK
    TAILS: REDSTONE_BLOCK
    BORDER: BLACK_STAINED_GLASS_PANE
    ACCENT: PURPLE_STAINED_GLASS_PANE
  # Main menu button slots (0-53). Duplicates or bad slots send the whole layout back to these defaults.
  MAIN-SLOTS:
    BALANCE: 4
    CREATE: 20
    BROWSE: 22
    CHALLENGE: 24
    MY-MATCHES: 29
    HISTORY: 30
    STATS: 31
    LEADERBOARDS: 32
    ACHIEVEMENTS: 33
    PRACTICE: 38
    SETTINGS: 40
    HELP: 42
    CLOSE: 49
