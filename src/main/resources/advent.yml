# ==============================================================================
# The Advent Calendar (new in 4.0)
# ==============================================================================
#
# /advent opens the Advent Calendar: one door for every day from FIRST-DAY to
# LAST-DAY of December. Behind each door is a gift; the last door is the big
# Christmas Eve gift. It works like the Spooky Calendar in halloween.yml.
#
# /advent only works while the ADVENT event runs (events.yml EVENTS.ADVENT,
# 1 to 26 December by default, or /event enable advent).
#
# Choosing gifts:
#   - In game: /advent edit. Click a door, drop items into the top area, click
#     the gold and amethyst buttons to set money and shards, then Save. Gifts
#     made there are kept in data/advent-prizes.yml and win over this file.
#   - In this file: DOORS.<day> (or DOORS.DEFAULT for every door without its
#     own gift). Each door takes MONEY, SHARDS, ITEMS ("MATERIAL:amount"),
#     COMMANDS (run by the console, %player% = the player) and DISPLAY.
#
# Test it outside December with /advent preview 2026-12-05 (until the next
# restart), or set PREVIEW-DATE.
# ==============================================================================

ENABLED: true

# Empty uses the server's own time zone.
TIME-ZONE: ""

MONTH: 12
FIRST-DAY: 1
LAST-DAY: 24

# DAILY: door 5 opens on the 5th. ALL-ON-LAST-DAY: every door opens on the last day.
MODE: DAILY

# true: players can still open doors from earlier days they missed.
CATCH-UP: true

# Extra days after LAST-DAY when unopened doors can still be claimed.
GRACE-DAYS: 2

# Pretend it is this date (yyyy-MM-dd), for testing. Leave empty on a live server.
PREVIEW-DATE: ""

CALENDAR:
  TITLE: "&8🎄 &c&lAdvent Calendar"
  OPEN-ANIMATION: true
  BORDER-ANIMATION: true
  BORDER-COLOURS:
    - RED_STAINED_GLASS_PANE
    - WHITE_STAINED_GLASS_PANE
    - GREEN_STAINED_GLASS_PANE
    - WHITE_STAINED_GLASS_PANE
  # Show what is behind a door before it is opened. false keeps it a surprise.
  SHOW-PRIZES: false
  SPIN-STEPS: 18
  DIALOG-REVEAL: true
  ICONS:
    OPEN: CHEST
    LOCKED: SPRUCE_DOOR
    CLAIMED: RED_CANDLE
    MISSED: POWDER_SNOW_BUCKET
    LAST-DOOR: ENDER_CHEST
  SPIN-ITEMS:
    - SNOWBALL
    - COOKIE
    - SWEET_BERRIES
    - CAKE
    - PUMPKIN_PIE
    - GLOW_BERRIES
  ANNOUNCE-LAST-DOOR: true

DOORS:
  DEFAULT:
    MONEY: 1000
    SHARDS: 3
    ITEMS:
      - "COOKIE:8"
  1:
    NAME: "&cFirst Snow"
    MONEY: 750
    ITEMS:
      - "SNOWBALL:16"
  6:
    NAME: "&cSaint Nicholas"
    MONEY: 2000
    SHARDS: 10
    ITEMS:
      - "GOLDEN_APPLE:2"
  12:
    NAME: "&cHalfway There"
    MONEY: 3000
    SHARDS: 12
    ITEMS:
      - "EXPERIENCE_BOTTLE:16"
  18:
    NAME: "&cWinter Wonderland"
    MONEY: 4000
    SHARDS: 15
    ITEMS:
      - "DIAMOND:3"
  24:
    NAME: "&c&l★ CHRISTMAS EVE ★"
    MONEY: 30000
    SHARDS: 100
    ITEMS:
      - "ENCHANTED_GOLDEN_APPLE:1"
      - "TOTEM_OF_UNDYING:1"
    COMMANDS: []
