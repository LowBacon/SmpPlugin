# ==============================================================================
# Seasonal events (new in 4.0)
# ==============================================================================
# /event opens the events menu: every event, whether it is running, and your
# progress. Click a running event to open it.
#
# Each event runs from START up to END. Dates are MM-dd (every year, e.g.
# 12-01) or yyyy-MM-dd (that year only), with an optional time: "12-24 18:00".
# A window may run past New Year ("12-28" to "01-03").
#
# Staff (smpplugin.admin.events):
#   /event enable <event>    run it now, whatever the date
#   /event disable <event>   stop it now (player progress is kept)
#   /event auto <event>      follow START and END again
#   /event reload [event]    read this file again
# These choices are saved in data/events-state.yml, not in this file.
# Stopping an event removes everything it does (drops, tasks, listeners);
# starting it again never hands out a reward a second time.
#
# Halloween keeps its own dates and settings in halloween.yml, and the Advent
# Calendar's doors and prizes are in advent.yml.
#
# Rewards (any reward below) take MONEY, SHARDS, ITEMS ("MATERIAL:amount"),
# COMMANDS (run by the console, %player% = the player) and DISPLAY lines.
# ==============================================================================

# Time zone that decides the date, e.g. "Europe/Helsinki". Empty: the server's.
TIME-ZONE: ""

EVENTS:
  ADVENT:
    ENABLED: true
    NAME: '&c&lAdvent Calendar'
    DESCRIPTION: 'Open one door every day of December for a gift. /advent'
    ICON: CAKE
    # The calendar decides which doors are open (advent.yml); this window is when
    # /advent works at all. It runs a little past the last door for latecomers.
    START: '12-01'
    END: '12-27'
    # Remind players about unopened doors when they join.
    JOIN-REMINDER: true
    START-MESSAGE: '&c&l{event} &7is open! Open today''s door with &f/advent&7.'
    END-MESSAGE: '&7The {event} has closed. See you next December!'

  CHRISTMAS:
    ENABLED: true
    NAME: '&c&lChristmas Presents'
    DESCRIPTION: 'Monsters drop wrapped presents. Right-click one to unwrap it.'
    ICON: CHEST
    START: '12-20'
    END: '12-27'
    START-MESSAGE: '&c&l{event}&7: monsters are dropping presents!'
    END-MESSAGE: '&7{event} are over. Merry Christmas!'
    PRESENTS:
      # Chance that a monster killed by a player drops a present.
      CHANCE-PERCENT: 5
      # Most presents one player can find in a day.
      DAILY-LIMIT: 10
      ITEM: CHEST
      ITEM-NAME: '&c&lChristmas Present'
      ITEM-LORE:
        - '&7A wrapped gift.'
        - ''
        - '&e▶ Right-click to unwrap'
      DROP-MESSAGE: '&cA present fell out! &7Pick it up.'
      # Picked by WEIGHT. ANNOUNCE: true tells the whole server.
      REWARDS:
        coins:
          WEIGHT: 55
          MONEY: 500
        cookies:
          WEIGHT: 25
          ITEMS:
            - 'COOKIE:16'
        shards:
          WEIGHT: 15
          SHARDS: 10
        jackpot:
          WEIGHT: 5
          MONEY: 10000
          SHARDS: 50
          ANNOUNCE: true

  EASTER:
    ENABLED: true
    NAME: '&d&lEaster Egg Hunt'
    DESCRIPTION: 'Find the eggs hidden around spawn. /easter'
    ICON: EGG
    # Easter moves every year: set the dates for this year's hunt.
    START: '04-01'
    END: '04-22'
    START-MESSAGE: '&d&l{event} &7has begun! Eggs are hidden around the server. &8(/easter)'
    END-MESSAGE: '&7The {event} is over. Thanks for hunting!'
    EGGS:
      # Eggs a player has not found give off particles only they can see.
      SPARKLE: true
      SPARKLE-RADIUS: 24
      ALREADY-FOUND: '&7You already found this egg.'
    # Given for every egg found.
    EGG-REWARD:
      MONEY: 250
    # Extra rewards when a player has found this many eggs (ALL = every egg).
    MILESTONES:
      5:
        MONEY: 2500
      10:
        SHARDS: 25
      ALL:
        MONEY: 15000
        SHARDS: 50
        ITEMS:
          - 'TOTEM_OF_UNDYING:1'

  SUMMER:
    ENABLED: true
    NAME: '&e&lSummer Splash'
    DESCRIPTION: 'Rewards for playing this summer, and lucky catches while fishing.'
    ICON: TROPICAL_FISH
    START: '06-21'
    END: '08-31'
    START-MESSAGE: '&e&l{event} &7has started: play and fish for extra rewards!'
    END-MESSAGE: '&7{event} is over. See you next summer!'
    # Every EVERY-MINUTES minutes of active play (not AFK), up to DAILY-LIMIT a day.
    PLAYTIME-REWARD:
      EVERY-MINUTES: 30
      DAILY-LIMIT: 4
      REWARD:
        MONEY: 1000
    FISHING:
      CHANCE-PERCENT: 10
      REWARDS:
        coins:
          WEIGHT: 70
          MONEY: 300
        shards:
          WEIGHT: 25
          SHARDS: 5
        treasure:
          WEIGHT: 5
          ITEMS:
            - 'HEART_OF_THE_SEA:1'
          ANNOUNCE: true

# Your own events. Each one rewards active play (PLAYTIME-REWARD) and, if you
# like, fishing (FISHING), exactly like SUMMER above. The key is its id in
# /event (letters, digits, - and _). Remove the example or set ENABLED: true.
CUSTOM-EVENTS:
  double-weekend:
    ENABLED: false
    NAME: '&b&lDouble Weekend'
    DESCRIPTION: 'Extra rewards for playing this weekend.'
    ICON: FIREWORK_ROCKET
    START: '2027-01-08 18:00'
    END: '2027-01-11 00:00'
    START-MESSAGE: '&b&l{event} &7has started!'
    END-MESSAGE: '&7{event} is over.'
    PLAYTIME-REWARD:
      EVERY-MINUTES: 20
      DAILY-LIMIT: 6
      REWARD:
        MONEY: 2000
        SHARDS: 5
