daily-wager-cap: "&7You have reached today's staking limit of {cap}. It resets at midnight server time."
daily-loss-cap: "&7You have reached today's net-loss limit of {cap}. It resets at midnight server time."
daily-match-cap: "&7You have created today's maximum of {cap} matches. It resets at midnight server time."
playtime-required: "&7CoinFlip unlocks after {minutes} minutes of playtime."
